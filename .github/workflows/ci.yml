# Optimized CI/CD Pipeline
# Features: Caching, Parallel Tests, SAST, Dependency Scanning, Performance Tests,
#           Blue-Green Deploy, Automated Rollback, Monitoring Integration

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD STAGE
  # ═══════════════════════════════════════════════════════════════════════════

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Verify Flask app
        run: cd api && python -c "from app import create_app; create_app('testing')"

  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY SCANNING (SAST + Dependency Checks) – Runs in parallel with build
  # ═══════════════════════════════════════════════════════════════════════════

  security-sast-js:
    name: SAST (CodeQL – JS/TS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-sast-python:
    name: SAST (CodeQL – Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-dependencies:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install Python deps for audit
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pip-audit

      - name: Run pip-audit
        run: pip-audit -r api/requirements.txt
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST STAGE – Parallel execution; frontend and backend tests run concurrently
  # ═══════════════════════════════════════════════════════════════════════════

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests (parallel workers)
        run: npm run test -- --project=chromium --workers=2

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    env:
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest-xdist

      - name: Run pytest (sharded, parallel)
        run: |
          cd api && pytest tests/ -m "not performance" -v -n auto --dist loadscope

  # ═══════════════════════════════════════════════════════════════════════════
  # PERFORMANCE TESTING – Runs after unit tests pass
  # ═══════════════════════════════════════════════════════════════════════════

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend]
    env:
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run performance benchmarks
        run: cd api && pytest tests/ -m performance -v
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY – Blue-Green strategy with health check and rollback
  # ═══════════════════════════════════════════════════════════════════════════

  deploy:
    name: Deploy (Blue-Green)
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, test-frontend, test-backend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outputs.success }}
      version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Restore previous version (for rollback)
        id: previous
        run: |
          echo "prev=${{ github.event.before }}" >> $GITHUB_OUTPUT
          echo "current=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to Green slot
        id: deploy
        run: |
          echo "Deploying ${{ github.sha }} to green slot..."
          echo "success=true" >> $GITHUB_OUTPUT
          echo "url=https://your-app.example.com" >> $GITHUB_OUTPUT
          echo ""
          echo "Add your platform-specific deploy steps (e.g., Vercel, Railway, Render)."
          echo "Blue-Green: Deploy new version to inactive slot before switching traffic."

      - name: Health check (post-deploy)
        id: health
        run: |
          # Replace with your app's health endpoint
          # curl -sf "${{ steps.deploy.outputs.url }}/health" || exit 1
          echo "Health check passed (customize URL in workflow)."

      - name: Switch traffic (Blue → Green)
        if: success()
        run: |
          echo "Traffic switched to green. Blue slot now holds previous version for rollback."

      - name: Notify monitoring
        if: success()
        env:
          MONITORING_WEBHOOK: ${{ secrets.MONITORING_WEBHOOK }}
        run: |
          if [ -n "$MONITORING_WEBHOOK" ]; then
            curl -sS -X POST "$MONITORING_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"deployment\",\"status\":\"success\",\"version\":\"${{ github.sha }}\",\"repo\":\"${{ github.repository }}\"}"
          else
            echo "Set MONITORING_WEBHOOK secret for Datadog/Slack/PagerDuty integration."
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # ROLLBACK – Runs on deploy failure; restores previous version
  # ═══════════════════════════════════════════════════════════════════════════

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before || 'HEAD~1' }}

      - name: Restore previous version
        run: |
          echo "Deployment failed. Rolling back to ${{ github.event.before }}..."
          echo "Add platform-specific rollback (e.g., redeploy previous, swap slots)."

      - name: Verify rollback
        run: echo "Rollback complete. Verify app health manually."

      - name: Notify failure
        env:
          MONITORING_WEBHOOK: ${{ secrets.MONITORING_WEBHOOK }}
        run: |
          if [ -n "$MONITORING_WEBHOOK" ]; then
            curl -sS -X POST "$MONITORING_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"deployment\",\"status\":\"failed\",\"rollback\":\"triggered\",\"repo\":\"${{ github.repository }}\"}"
          fi
