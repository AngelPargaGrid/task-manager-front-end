# SonarQube / SonarCloud project configuration
# Use with: sonar-scanner

sonar.projectKey=customer-support-frontend
sonar.projectName=Customer Support - Full Stack
sonar.projectVersion=1.0

sonar.sources=src,api/app
sonar.tests=qa-automation/tests,tests,api/tests
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/test_*.py

sonar.exclusions=**/node_modules/**,**/dist/**,**/venv/**,**/__pycache__/**,**/*.config.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.python.xunit.reportPaths=api/test-results.xml
