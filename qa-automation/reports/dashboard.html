<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Quality Dashboard</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #38bdf8; --success: #4ade80; --warn: #fbbf24; --error: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
    h1 { color: var(--accent); margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .metrics-section { margin-bottom: 2rem; }
    .metrics-section h2 { color: var(--accent); font-size: 1rem; text-transform: uppercase; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; border-left: 4px solid var(--accent); }
    .card.success { border-color: var(--success); }
    .card.warn { border-color: var(--warn); }
    .card.error { border-color: var(--error); }
    .card.unknown { border-color: #64748b; }
    .card h3 { margin: 0 0 0.25rem; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; }
    .card .value { font-size: 1.75rem; font-weight: 700; }
    .card .target { font-size: 0.85rem; color: #64748b; }
    .recommendations { background: var(--card); border-radius: 12px; padding: 1.5rem; margin-top: 2rem; }
    .recommendations h2 { color: var(--accent); }
    .rec-item { padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .progress { height: 6px; background: #334155; border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 3px; }
    .progress-fill.warn { background: var(--warn); }
    .progress-fill.error { background: var(--error); }
  </style>
</head>
<body>
  <h1>QA Quality Dashboard</h1>
  <p class="subtitle">Customer Support Full-Stack · Quality targets: Coverage 80%+ · Complexity &lt;10 · 0 critical vulns · &lt;500ms · &lt;1% errors</p>

  <section class="metrics-section">
    <h2>Quality Metrics</h2>
    <div class="grid" id="metrics"></div>
  </section>

  <section class="metrics-section">
    <h2>Test & Security Summary</h2>
    <div class="grid" id="summary"></div>
  </section>

  <section class="recommendations">
    <h2>Recommendations</h2>
    <div id="recommendations"></div>
  </section>

  <script>
    const reportPath = './output/qa-report.json';

    async function loadReport() {
      try {
        const res = await fetch(reportPath);
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('metrics').innerHTML = `
          <div class="card">
            <h3>Status</h3>
            <p>No report found. Run <code>./scripts/run-all-qa.sh</code></p>
          </div>
        `;
        renderRecommendations([{ priority: 'info', text: 'Run the QA master script to generate metrics.' }]);
      }
    }

    function metricCard(m) {
      const status = m.status || 'unknown';
      const cls = status === 'pass' ? 'success' : status === 'fail' ? 'error' : status === 'warn' ? 'warn' : 'unknown';
      let progress = '';
      if (m.label === 'Test Coverage' && m.unit === '%' && m.target) {
        const pct = Math.min(100, (m.value / m.target) * 100);
        const fillCls = m.value >= m.target ? 'success' : m.value >= m.target * 0.7 ? 'warn' : 'error';
        progress = `<div class="progress"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>`;
      }
      const targetStr = m.target != null ? `Target: ${m.target}${m.unit || ''}` : '';
      return `
        <div class="card ${cls}">
          <h3>${m.label}</h3>
          <div class="value">${m.value}${m.unit || ''}</div>
          <div class="target">${targetStr}</div>
          ${progress}
        </div>
      `;
    }

    function render(data) {
      const m = data.metrics || {};
      const metricsHtml = [
        { label: 'Test Coverage', ...m.coverage, target: data.targets?.coverage },
        { label: 'Max Complexity', ...m.complexity, target: data.targets?.complexity },
        { label: 'Critical Vulns', ...m.security_critical, target: data.targets?.security_critical },
        { label: 'Response Time (p95)', ...m.response_time_ms, unit: m.response_time_ms?.unit || 'ms', target: data.targets?.response_time_ms },
        { label: 'Error Rate', ...m.error_rate_pct, target: data.targets?.error_rate_pct },
      ].map(metricCard).join('');
      document.getElementById('metrics').innerHTML = metricsHtml;

      const s = data.sections || {};
      const summaryHtml = [];
      if (s.pytest) {
        const { passed, failed, total } = s.pytest;
        summaryHtml.push(`<div class="card ${failed > 0 ? 'error' : 'success'}"><h3>Backend Tests</h3><div class="value">${passed}/${total}</div><div class="target">${failed} failed</div></div>`);
      }
      if (s.npm_audit) {
        const { critical, high } = s.npm_audit;
        summaryHtml.push(`<div class="card ${critical > 0 ? 'error' : high > 0 ? 'warn' : 'success'}"><h3>npm Audit</h3><div class="value">${critical} crit, ${high} high</div></div>`);
      }
      summaryHtml.push(`<div class="card"><h3>Report</h3><div class="value" style="font-size:1rem">${new Date(data.generated_at || Date.now()).toLocaleString()}</div></div>`);
      document.getElementById('summary').innerHTML = summaryHtml.join('') || '';

      const recs = deriveRecommendations(data);
      renderRecommendations(recs);
    }

    function deriveRecommendations(data) {
      const recs = [];
      const m = data.metrics || {};
      const t = data.targets || {};
      if (m.coverage?.value < (t.coverage || 80) && m.coverage?.value > 0) recs.push({ priority: 'high', text: `Increase test coverage to ${t.coverage}%+ (current: ${m.coverage.value}%).` });
      if (m.complexity?.value >= (t.complexity || 10) && m.complexity?.value > 0) recs.push({ priority: 'medium', text: `Reduce code complexity (max ${m.complexity.value}, target <${t.complexity}).` });
      if (m.security_critical?.value > 0) recs.push({ priority: 'critical', text: 'Address critical security vulnerabilities immediately.' });
      if (m.response_time_ms?.value >= (t.response_time_ms || 500) && m.response_time_ms?.value > 0) recs.push({ priority: 'medium', text: `Optimize response time (p95: ${m.response_time_ms.value}ms, target <${t.response_time_ms}ms).` });
      if (m.error_rate_pct?.value >= (t.error_rate_pct || 1) && m.error_rate_pct?.value > 0) recs.push({ priority: 'high', text: `Reduce error rate (${m.error_rate_pct.value}%, target <${t.error_rate_pct}%).` });
      if (recs.length === 0) recs.push({ priority: 'info', text: 'All quality gates passed.' });
      return recs;
    }

    function renderRecommendations(recs) {
      document.getElementById('recommendations').innerHTML = recs.length
        ? recs.map(r => `<div class="rec-item"><strong>${r.priority}</strong>: ${r.text}</div>`).join('')
        : '';
    }

    loadReport();
  </script>
</body>
</html>
