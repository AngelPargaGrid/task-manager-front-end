<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Quality Dashboard</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #38bdf8; --success: #4ade80; --warn: #fbbf24; --error: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
    h1 { color: var(--accent); margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.5rem; border-left: 4px solid var(--accent); }
    .card.success { border-color: var(--success); }
    .card.warn { border-color: var(--warn); }
    .card.error { border-color: var(--error); }
    .card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; text-transform: uppercase; color: #94a3b8; }
    .card .value { font-size: 2rem; font-weight: 700; }
    .recommendations { background: var(--card); border-radius: 12px; padding: 1.5rem; margin-top: 2rem; }
    .recommendations h2 { color: var(--accent); }
    .rec-item { padding: 0.5rem 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <h1>QA Quality Dashboard</h1>
  <p class="subtitle">Customer Support Full-Stack · Generated by QA Automation</p>
  
  <div class="grid" id="metrics"></div>
  
  <section class="recommendations">
    <h2>AI-Generated Improvement Recommendations</h2>
    <div id="recommendations"></div>
  </section>

  <script>
    const reportPath = './output/qa-report.json';
    
    async function loadReport() {
      try {
        const res = await fetch(reportPath);
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('metrics').innerHTML = `
          <div class="card">
            <h3>Status</h3>
            <p>No report found. Run <code>./scripts/run-all-qa.sh</code> or <code>python reports/generate-report.py</code>.</p>
          </div>
        `;
        renderRecommendations([]);
      }
    }

    function render(data) {
      const sections = data.sections || {};
      const html = [];
      
      if (sections.pytest) {
        const { passed, failed, total } = sections.pytest;
        const status = failed > 0 ? 'error' : 'success';
        html.push(`<div class="card ${status}"><h3>Backend Tests (pytest)</h3><div class="value">${passed}/${total}</div><p>${failed} failed</p></div>`);
      }
      if (sections.npm_audit) {
        const { high = 0, critical = 0 } = sections.npm_audit;
        const status = critical > 0 ? 'error' : high > 0 ? 'warn' : 'success';
        html.push(`<div class="card ${status}"><h3>npm Audit</h3><div class="value">${critical} critical, ${high} high</div></div>`);
      }
      html.push(`<div class="card"><h3>Report</h3><div class="value">${new Date(data.generated_at || Date.now()).toLocaleString()}</div></div>`);
      
      document.getElementById('metrics').innerHTML = html.join('') || '<div class="card"><h3>No Data</h3><p>Run QA pipeline</p></div>';
      
      const recs = deriveRecommendations(data);
      renderRecommendations(recs);
    }

    function deriveRecommendations(data) {
      const recs = [];
      const s = data.sections || {};
      if (s.pytest?.failed > 0) recs.push({ priority: 'high', text: 'Fix failing pytest tests before merge.' });
      if (s.npm_audit?.critical > 0) recs.push({ priority: 'high', text: 'Address critical npm vulnerabilities immediately.' });
      if (s.npm_audit?.high > 0) recs.push({ priority: 'medium', text: 'Review and patch high-severity npm vulnerabilities.' });
      recs.push({ priority: 'low', text: 'Add unit tests for components with low coverage.' });
      recs.push({ priority: 'low', text: 'Run Lighthouse CI in PR to track performance regressions.' });
      return recs;
    }

    function renderRecommendations(recs) {
      document.getElementById('recommendations').innerHTML = recs.length
        ? recs.map(r => `<div class="rec-item"><strong>${r.priority}</strong>: ${r.text}</div>`).join('')
        : '<p>No recommendations. Quality gates passed.</p>';
    }

    loadReport();
  </script>
</body>
</html>
